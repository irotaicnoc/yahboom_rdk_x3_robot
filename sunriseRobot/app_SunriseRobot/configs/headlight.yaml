# Verbosity levels
# 0: errors only
# 1: errors and important information
# 2: more information
# 3: debug
verbose: 2

# --- COB LED strip (external headlight for the camera) ---
# The strip is a passive 5V load (two wires, no signal input). It is powered from the expansion board's
# 5V output and switched by a MOSFET module whose trigger is driven by an RDK X3 GPIO pin (set in
# global_constants.py as HEADLIGHT_PIN). The pin uses hardware PWM, so the MOSFET passes a variable duty
# cycle to the strip and the brightness is adjustable. Tie the MOSFET trigger ground to the RDK ground.

# PWM duty cycle (0-100) for each light state. Index 0 is ALWAYS the OFF state (duty 0); the remaining
# entries are the "on" states the light can cycle through (turn_on() uses index 1, next_level() cycles
# through all of them). Perceived brightness vs duty depends on the strip, so tune these on the robot.
# To change the number of steps, list more/fewer values, e.g. [0, 25, 50, 100] -> off, low, half, full.
brightness_levels:
  - 0     # OFF
  - 50    # ON (half)
  - 100   # ON (full)

# PWM carrier frequency in Hz for the MOSFET gate. A few hundred Hz to a few kHz avoids visible flicker;
# 1000 Hz is a safe default. If the strip buzzes or the MOSFET runs hot, adjust this.
pwm_frequency: 1000

# --- Automatic control in autonomous vision mode ---
# When True, the headlight turns on automatically if the camera image is dark while the robot is in
# MODE_AUTONOMOUS_VISION. It then stays on until the robot leaves vision mode (latched on purpose:
# once the light is on it brightens its own view, so re-evaluating each frame would make it flicker).
# Manual controls (mobile app / controller) work at any time. Auto control is supported on the
# internal and usb_v1 cameras (the usb_v2 pipeline does not expose the frame to the agent).
auto_in_vision_mode: True
# Mean image brightness (0-255). Below this value the scene is considered dark and the light turns on.
auto_brightness_threshold: 50
