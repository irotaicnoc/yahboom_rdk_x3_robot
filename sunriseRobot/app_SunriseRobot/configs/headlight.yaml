# Verbosity levels
# 0: errors only
# 1: errors and important information
# 2: more information
# 3: debug
verbose: 2

# --- Camera headlight: automatic control in autonomous vision mode ---
# The COB LED strip itself now physically lives on the Jetson Nano and is driven there (see
# configs/headlight.yaml in the voice_robot_interaction repo for pin / PWM mode / brightness levels). The
# RDK X3 stays the control surface: the vision agent decides when the scene is dark and the RemoteHeadlight
# proxy forwards the on/off command to the Jetson over the command channel.
#
# When True, the headlight turns on automatically if the camera image is dark while the robot is in
# MODE_AUTONOMOUS_VISION. It then stays on until the robot leaves vision mode (latched on purpose: once the
# light is on it brightens its own view, so re-evaluating each frame would make it flicker). Manual controls
# (mobile app / controller) work at any time. Auto control is supported on the internal and usb_v1 cameras
# (the usb_v2 pipeline does not expose the frame to the agent).
auto_in_vision_mode: True
# Mean image brightness (0-255). Below this value the scene is considered dark and the light turns on.
auto_brightness_threshold: 50
