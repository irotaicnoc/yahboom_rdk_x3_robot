# Verbosity levels
# 0: errors only
# 1: errors and important information
# 2: more information
# 3: debug
verbose: 2

# --- RC LED light bar (external headlight for the camera) ---
# The light bar plugs into one of the expansion board's "PWM servo" ports (3-pin G/V/S connector).
# Those ports are driven by the onboard STM32, so the light is controlled over the serial protocol
# via robot_body.set_pwm_servo(servo_id, angle). The port is set in global_constants.py
# (HEADLIGHT_SERVO_ID). Power can come from the port's V pin (match the board's "6V8 / Choose 5V"
# jumper to the bar) or directly from the battery (then connect only the signal wire).

# Angles (0-180) for each light state. Index 0 is ALWAYS the OFF state; the remaining entries are the
# "on" states the light can cycle through (turn_on() uses index 1, next_level() cycles through all of
# them). The STM32 maps angle to an RC servo pulse, but the exact angle -> behavior mapping depends on
# your specific light bar, so tune these on the robot. To add brightness steps, list more values, e.g.:
#   [0, 90, 180]  -> off, half, full
angle_levels:
  - 0     # OFF
  - 180   # ON (full)

# --- Automatic control in autonomous vision mode ---
# When True, the headlight turns on automatically if the camera image is dark while the robot is in
# MODE_AUTONOMOUS_VISION. It then stays on until the robot leaves vision mode (latched on purpose:
# once the light is on it brightens its own view, so re-evaluating each frame would make it flicker).
# Manual controls (mobile app / controller) work at any time. Auto control is supported on the
# internal and usb_v1 cameras (the usb_v2 pipeline does not expose the frame to the agent).
auto_in_vision_mode: True
# Mean image brightness (0-255). Below this value the scene is considered dark and the light turns on.
auto_brightness_threshold: 50
