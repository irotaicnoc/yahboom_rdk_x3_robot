verbose: 1

# Master switch for the intra-robot audio bridge to the Jetson Nano. When False, neither server is started
# (the ReSpeaker is left entirely to the VR audio nodes / sound agent).
enabled: True

# Wired intra-robot link. Both servers bind the static IP of the direct ethernet cable to the Jetson Nano,
# so they are NOT exposed on wlan0 / hotspot / tailscale0. Different ports from the JSON command channel
# (65432) and the arm camera relay (65433).
host: '192.168.10.11'

# Microphone stream: RDK X3 -> Jetson. Push-to-talk gated (South button). While a voice session is held the
# RDK X3 streams the selected source with is_voice=True: the ReSpeaker processed channel for a joystick press
# (opened on demand, released when idle), or the app mic frames from /audio_from_vr for an app press. Between
# sessions it sends is_voice=False keepalive frames (see idle_frame_interval).
mic_stream_port: 65434
# Speaker playback: Jetson -> RDK X3. The Jetson sends every TTS response here; the RDK X3 routes it by where
# the request came from (robot_head.last_voice_source): a robot-mic response is played through the ReSpeaker
# output (echo canceller reference, so the mic does not re-record it), while an app response is sent to the
# connected app only (TtsToAppPublisher / /audio_to_app) and the robot stays silent.
speaker_playback_port: 65435

# Cadence (seconds) of the is_voice=False frames sent while no push-to-talk session is held. The first such
# frame after a hold is the Jetson's release signal (it then finalizes the clip); the rest are idle keepalive.
idle_frame_interval: 0.05

# Microphone capture parameters. These mirror the VR audio publisher: the ReSpeaker exposes 6 interleaved
# int16 channels and channel 0 is the processed one (AEC + beamforming + noise suppression). 16 kHz mono is
# what the Jetson voice interaction expects (see the Jetson microphone_listener.yaml stream_params).
mic_sample_rate: 16000
mic_capture_channels: 6
mic_processed_channel: 0
mic_format: S16_LE
mic_chunk_size: 1024

# Speaker playback parameters. These must match the Jetson TTS output (24 kHz mono int16, see the Jetson
# main_thread.play_audio call).
speaker_sample_rate: 24000
speaker_channels: 1
speaker_format: S16_LE
speaker_chunk_size: 1024

# If a listening socket cannot bind yet (wired link not up), retry after this interval (seconds).
retry_interval: 5
