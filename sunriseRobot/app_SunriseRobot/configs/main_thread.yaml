# Verbosity levels
# 0: errors only
# 1: errors and important information
# 2: more information
# 3: debug
verbose: 2

# serial parameters
com: /dev/ttyUSB0
#com: /dev/myserial
baud_rate: 115200

camera_type: internal
#camera_type: usb_v1
#camera_type: usb_v2

# whether a robotic arm is attached to the robot
arm_present: true

controller_id: 0