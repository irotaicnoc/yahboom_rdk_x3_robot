verbose: 0

# for autonomous mode only
# if the robot is almost aligned with the target (angle < steer_threshold_1)
#     the robot will advance
# if the robot is almost somewhat aligned with the target (steer_threshold_1 < angle < steer_threshold_2)
#     the robot will steer AND advance
# if the robot is not aligned with the target (angle > steer_threshold_2)
#     the robot will steer
steer_threshold_1: 0.25
steer_threshold_2: 0.4
angular_speed_range: [1.0, 2.0]
save_images: False
use_gpio_led: True
#think_steps_if_no_target: 1
think_steps_if_no_target: 3

camera_kwargs:
  video_capture_kwargs:
    pipe_id: 1
    video_index: -1
    fps: 2
  #    width: 1920
  #    height: 1080
    width: 640
    height: 480
#    width: 1280
#    height: 960
  #    raw_width: 1920
  #    raw_height: 1080
